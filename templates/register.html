<!DOCTYPE html>
<html>
<head>
    <title>Cruise Booking - Register</title>
</head>

<body>

<h2>Create Customer Account</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">

    <input
        type="text"
        name="name"
        placeholder="Full Name"
        required
    >

    <br><br>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<br>

<a href="/login">Already have an account? Login</a>

</body>
</html>
