<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Cruise Booking{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark cruise-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('home') }}">

            🚢 CruiseBook

        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="{{ url_for('home') }}">

                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{{ url_for('cruises') }}">

                        Cruises

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{{ url_for('bookings') }}">

                        Bookings

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- ================= CONTENT ================= -->

<main>

    {% block content %}
    {% endblock %}

</main>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container text-center">

        <h5>🚢 CruiseBook</h5>

        <p class="mb-1">
            Your journey begins at sea.
        </p>

        <small>
            © 2026 CruiseBook. All rights reserved.
        </small>

    </div>

</footer>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
